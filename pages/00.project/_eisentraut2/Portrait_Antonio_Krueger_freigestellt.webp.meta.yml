title: Prof. Dr. Antonio Krüger
description: |
  Ich bin Julia Eisentraut, Informatikerin und Landtagsabgeordnete für den schönen Kreis Lippe in Nordrhein-Westfalen. 
  Meine Begeisterung für die Welt der Zahlen begann schon in der Schulzeit – Mathematik wurde früh zu meiner Leidenschaft..
  Über ein Juniorstudium, anschließendem Bachelor und Master sowie meine laufende Promotion konnte ich diese Leidenschaft weiter vertiefen.
  Heute freue ich mich umso mehr, meine wissenschaftliche Expertise aktiv in politische Arbeit zu übersetzen. 
  Ich setze mich leidenschaftlich für eine digitalisierte Welt ein, eine die feministisch, machtkritisch und inklusiv gestaltet ist. 
  Die digitale Transformation kann uns nur gelingen, wenn sie alle Menschen mitnimmt. Denn Algorithmen können mächtig sein und mächtig diskriminieren.
