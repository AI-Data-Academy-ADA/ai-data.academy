title: "Pretix Calendar/ List View"
extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            header.css_url:
              type: text
              size: large
              label: Widget CSS URL
              help: "The css url for the pretix widget e.g. https://pretix.eu/demo/democon/widget/v2.css"
            header.js_url:
              type: text
              size: large
              label: Widget JS URL
              help: "The js url for the pretix widget e.g. https://pretix.eu/widget/v2.en.js"
            header.event_url:
              type: text
              size: large
              label: Event URL
              help: "The event url for the pretix widget e.g. https://pretix.eu/demo/democon/"
