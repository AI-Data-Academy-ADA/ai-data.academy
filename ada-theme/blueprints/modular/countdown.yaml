title: "Countdown"
extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            header.target_date:
              type: text
              size: large
              label: "Target Date and Time"
              placeholder: "YYYY-MM-DDTHH:MM:SS"
              help: "e.g., 2026-10-27T10:00:00"
              validate:
                required: true
            header.labels:
              type: array
              label: "Countdown Labels"
              help: "Text lines to display above the countdown timer"
              fields:
                label_item:
                  type: text
                  placeholder: "e.g., bis zum Kick-Off KI-Day"
