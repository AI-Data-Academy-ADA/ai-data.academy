title: "GeoJSON Map"
extends@: default

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        content:
          fields:
            # header.geojson:
            #   type: textarea
            #   label: GeoJSON
            #   help: "Enter the GeoJSON data as yaml to display on the map"
            #   size: large
            #   validate:
            #     required: true
            header.geojson:
              name: geojson
              type: list
              style: vertical
              label: Map Pins
              fields:
                .description:
                  type: markdown
                  label: Description (Markdown)
                  validate:
                    required: true
                .coordinates:
                  type: array
                  label: Coordinates (Longitude, Latitude)
                  validate:
                    min: 2
                    max: 2
                    required: true
                  value_only: true
                  fields:
                    value:
                      type: number
                      validate:
                        type: number
            header.no_y_padding:
              type: toggle
              label: No vertical padding
              default: 1
              options:
                1: PLUGIN_ADMIN.ENABLED
                0: PLUGIN_ADMIN.DISABLED
              validate:
                type: bool
            header.map_css_url:
              type: text
              size: large
              label: URL to the maplibre css file
              help: "e.g. https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.css"
            header.map_js_url:
              type: text
              size: large
              label: URL to the maplibre js file
              help: "e.g. https://unpkg.com/maplibre-gl@^5.24.0/dist/maplibre-gl.js"
